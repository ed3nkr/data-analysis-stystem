services:
  postgres:
    image: postgres:16
    container_name: reviewsales-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-reviewsales}
      POSTGRES_USER: ${DB_USERNAME:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-app}
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-app} -d ${DB_NAME:-reviewsales}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
