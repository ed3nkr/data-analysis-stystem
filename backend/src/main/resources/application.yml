spring:
  application:
    name: reviewsales-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reviewsales}
    username: ${DB_USERNAME:app}
    password: ${DB_PASSWORD:app}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true
  jackson:
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    # HS256 비밀키. 환경변수로만 받는다 (local 프로필은 비어 있으면 임시 키 생성)
    secret: ${JWT_SECRET:}
    access-ttl: 30m
    refresh-ttl: 14d
  cookie:
    secure: ${COOKIE_SECURE:false}
  author-hash-salt: ${AUTHOR_HASH_SALT:}
  upload-dir: ${UPLOAD_DIR:./data/uploads}
  collector:
    base-url: ${COLLECTOR_BASE_URL:http://localhost:8000}
    connect-timeout: 5s
    read-timeout: 20m
    max-requests: 200
  collect:
    min-interval: ${COLLECT_MIN_INTERVAL:1h}
    default-lookback-months: 6
    weekly-enabled: ${COLLECT_WEEKLY_ENABLED:false}
    weekly-cron: "0 0 4 * * MON"
  oauth:
    redirect-base: ${OAUTH_REDIRECT_BASE:http://localhost:8080}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:8080}
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
      authorize-uri: https://kauth.kakao.com/oauth/authorize
      token-uri: https://kauth.kakao.com/oauth/token
      user-info-uri: https://kapi.kakao.com/v2/user/me
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      authorize-uri: https://accounts.google.com/o/oauth2/v2/auth
      token-uri: https://oauth2.googleapis.com/token
      user-info-uri: https://openidconnect.googleapis.com/v1/userinfo
